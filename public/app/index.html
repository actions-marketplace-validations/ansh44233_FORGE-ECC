<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0a0e">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/forge-mark.svg">
<title>FORGE Control Center</title>
<style>
:root{color-scheme:dark;--bg:#0b0a0e;--panel:#141217;--panel2:#1a171d;--panel3:#211d24;--ink:#f4f0ed;--muted:#a59d9b;--faint:#6f6866;--line:rgba(235,218,210,.12);--line2:rgba(235,218,210,.2);--accent:#e8b3a2;--accent2:#a9c5d2;--ok:#9fd5a4;--warn:#f0c77a;--high:#f29b7c;--crit:#ff6b6b;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(1200px 600px at 85% -10%,rgba(232,179,162,.08),transparent 60%),var(--bg);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:10px;z-index:5;display:flex;align-items:center;gap:18px;padding:0 10px 0 18px;height:56px;margin:10px 14px 0;border:1px solid var(--line2);border-radius:16px;background:rgba(14,12,17,.8);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.08em;text-decoration:none}
.brand img{width:26px;height:26px}
.brand small{font-weight:600;letter-spacing:.02em;color:var(--muted)}
.topnav{display:flex;gap:4px;height:100%;margin-left:8px}
.topnav a{display:flex;align-items:center;padding:0 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;border-bottom:2px solid transparent}
.topnav a:hover{color:var(--ink)}
.topnav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.spacer{flex:1}
.who{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:650;font-size:13px;text-decoration:none;cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);background:rgba(232,179,162,.08)}
.btn.primary{background:var(--accent);color:#1a1210;border-color:var(--accent)}
.btn.primary:hover{background:#f0c4b5}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:progress}
.layout{display:grid;grid-template-columns:272px 1fr;min-height:calc(100vh - 76px);margin-top:10px}
aside{border-right:1px solid var(--line);padding:16px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}
aside h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:6px 4px 10px}
.search{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);margin-bottom:10px}
.repo{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;font-size:13px}
.repo:hover{background:var(--panel)}
.repo.active{background:var(--panel2);border-color:var(--line2)}
.repo .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.lock{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px}
main{padding:26px 30px 70px;max-width:1320px;width:100%;min-width:0}
.empty{max-width:600px;margin:11vh auto;text-align:center}
.welcome{position:relative;isolation:isolate;overflow:hidden;min-height:calc(100vh - 66px)}
.welcome:before{content:"";position:absolute;inset:0;z-index:-2;background:url('/forge-background.png') center/cover no-repeat;opacity:.22;filter:saturate(.9);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 75%);mask-image:linear-gradient(180deg,#000 0%,transparent 75%)}
.welcome .empty{margin:9vh auto 0;max-width:720px}
.welcome .empty h1{font-size:48px;letter-spacing:-.03em}
.welcome .empty h1 span{color:var(--accent)}
.shot{max-width:1100px;margin:44px auto 60px;padding:0 24px}
.shot .frame{border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:#0d0c10;box-shadow:0 40px 100px rgba(0,0,0,.55)}
.shot .bar2{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--faint)}
.shot .bar2 i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14)}
.shot img{display:block;width:100%;height:auto}
.shot p{text-align:center;color:var(--faint);font-size:12px;margin-top:10px}
.empty h1{font-size:36px;line-height:1.12;margin:0 0 12px;letter-spacing:-.01em}
.empty p{color:var(--muted)}
.empty .actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px;text-align:left}
.features div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel)}
.features b{display:block;font-size:13px}
.features span{color:var(--muted);font-size:12px}
.banner{padding:12px 14px;border:1px solid rgba(240,199,122,.35);background:rgba(240,199,122,.07);border-radius:10px;margin-bottom:18px;color:#f6deb0}
.head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.head h1{margin:0;font-size:24px;letter-spacing:-.01em;word-break:break-word}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:inline-flex;align-items:center;gap:7px;padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-size:11px;padding:0 7px;border-radius:999px;background:var(--panel3);color:var(--muted);font-weight:700}
.count.alert{background:rgba(255,107,107,.15);color:var(--crit)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .n{font-family:var(--mono);color:var(--accent);letter-spacing:0}
.card h3 a{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;color:var(--accent2);text-decoration:none;font-size:12px}
.kpi{display:flex;align-items:center;gap:14px;min-height:74px}
.kpi .big{font-size:28px;font-weight:800;line-height:1}
.kpi .sub{color:var(--muted);font-size:12px;margin-top:4px}
.ring{--v:0;--c:var(--ok);width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),rgba(255,255,255,.07) 0);display:grid;place-items:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:18px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.stack{display:grid;gap:14px;align-content:start}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;border:1px solid currentColor;white-space:nowrap}
.sev-critical{color:var(--crit)}.sev-high{color:var(--high)}.sev-medium{color:var(--warn)}.sev-low{color:var(--accent2)}
.lvl-low{color:var(--ok)}.lvl-medium{color:var(--warn)}.lvl-high{color:var(--high)}.lvl-critical{color:var(--crit)}
.st-passed,.st-active,.st-native{color:var(--ok)}.st-failed,.st-error,.st-rejected{color:var(--crit)}.st-stalled,.st-unsupported{color:var(--faint)}.st-needs-review{color:var(--high)}.st-candidate,.st-shared{color:var(--warn)}.st-dry-run,.st-running{color:var(--accent2)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--faint);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-top:0}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.02)}
code,.mono{font-family:var(--mono);font-size:12px}
.loc{color:var(--accent2);word-break:break-all}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.rec{color:var(--muted);font-size:12px;margin-top:3px}
.pr{padding:12px 0;border-top:1px solid var(--line)}
.pr:first-of-type{border-top:0;padding-top:0}
.pr-title{display:flex;gap:10px;align-items:baseline}
.pr-title a{font-weight:650;text-decoration:none}
.pr-title a:hover{text-decoration:underline}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.reasons{margin:0;padding-left:18px;color:var(--muted);font-size:12px}
.langs{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:4px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--dot)}
pre{margin:8px 0 0;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:auto;font:12px/1.6 var(--mono)}
ul.plain{margin:6px 0 0;padding-left:18px}
ul.plain li{margin:3px 0}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.timeline li:first-child{border-top:0}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.status:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dot)}
.cat{display:grid;grid-template-columns:180px 1fr 52px;gap:12px;align-items:center;padding:7px 0}
.cat .bar{margin:0}
.cat b{font-size:13px;font-weight:650}
.cat .s{text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
details.catd{border-top:1px solid var(--line);padding:10px 0}
details.catd:first-of-type{border-top:0}
details.catd summary{list-style:none;cursor:pointer}
details.catd summary::-webkit-details-marker{display:none}
.ev{margin:8px 0 0 192px;font-size:12px}
.ev li{margin:3px 0}
.ev .plus{color:var(--ok)}
.ev .todo{color:var(--warn)}
.actions-list{counter-reset:a;list-style:none;margin:0;padding:0}
.actions-list li{counter-increment:a;display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.actions-list li:first-child{border-top:0}
.actions-list li:before{content:counter(a);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--panel3);color:var(--accent);font-weight:800;font-size:11px}
.note{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel2);margin-bottom:12px}
.note.handoff{border-color:rgba(232,179,162,.35)}
.note .fields{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.note .fields b{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:650;margin-left:4px}
.note .body{white-space:pre-wrap;word-break:break-word;font-size:13px}
.note .evid{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.note .evid code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .search{width:auto;flex:1;min-width:200px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;font-size:12px;font-weight:650;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--panel3);color:var(--ink)}
.conf{display:inline-block;width:70px;height:6px;border-radius:6px;background:rgba(255,255,255,.07);vertical-align:middle;overflow:hidden;margin-right:6px}
.conf i{display:block;height:100%;background:var(--accent2)}
.cmd{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 6px 6px 10px;margin-top:8px}
.cmd code{flex:1;overflow-x:auto;white-space:nowrap}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.hcard.on{border-color:rgba(159,213,164,.35)}
.hcard .t{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.hcard .t span{margin-left:auto}
.caps{display:grid;grid-template-columns:auto auto;gap:4px 12px;font-size:12px}
.loopc{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);margin-bottom:12px}
.loopc .g{font-weight:650;margin:6px 0}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.checks span{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:7px;padding:2px 7px}
.checks .p{color:var(--ok);border-color:rgba(159,213,164,.35)}
.checks .f{color:var(--crit);border-color:rgba(255,107,107,.35)}
.fleet td .bar{width:120px;display:inline-block;margin:0 8px 0 0;vertical-align:middle}
.section-intro{color:var(--muted);font-size:13px;margin:-8px 0 16px;max-width:760px}
.skeleton{background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:14px;height:110px}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;right:18px;bottom:18px;max-width:420px;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 10px 40px rgba(0,0,0,.45);font-size:13px;z-index:20}
.toast.err{border-color:rgba(255,107,107,.5)}
.mobile-only{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3{grid-template-columns:1fr}.features{grid-template-columns:1fr}}
@media (max-width:760px){.top{margin:8px 8px 0}.welcome .empty h1{font-size:34px}.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);max-height:36vh}main{padding:20px 16px}.cat{grid-template-columns:1fr 44px}.cat .bar{grid-column:1/-1;order:3}.ev{margin-left:0}.topnav{display:none}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}.who,.top .install{display:none}.top{padding:0 14px}.head .actions{margin-left:0}.findings th:nth-child(3),.findings td:nth-child(3){display:none}.mobile-only{display:block}.timeline li{grid-template-columns:80px 1fr}.fleet th:nth-child(4),.fleet td:nth-child(4),.fleet th:nth-child(5),.fleet td:nth-child(5){display:none}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><img src="/forge-mark.svg" alt=""> FORGE <small>Control Center</small></a>
  <nav class="topnav" id="topnav" hidden>
    <a href="#/" id="nav-fleet">Fleet</a>
    <a href="#/" id="nav-repo">Repository</a>
  </nav>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <a class="btn install" href="/api/github/install">Install App</a>
  <button class="btn" id="logout" hidden>Sign out</button>
</header>
<div id="root"></div>
<script>
"use strict";
const root = document.getElementById("root");
const COLORS = ["#e8b3a2","#a9c5d2","#c7d5b2","#d8b4e2","#f0c77a","#8fb8a8","#c9a27e"];
const SEV_RANK = { critical: 0, high: 1, medium: 2, low: 3 };
const TABS = [
  ["overview", "Overview"], ["scorecard", "Scorecard"], ["shield", "Shield"], ["pulls", "Pull requests"],
  ["memory", "Memory"], ["instincts", "Instincts"], ["loops", "Loops"], ["harnesses", "Harnesses"], ["activity", "Activity"],
];

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") el.className = value;
    else if (key === "style") el.setAttribute("style", value);
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? "" : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === undefined || child === null || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}
const safeUrl = url => (typeof url === "string" && /^https:\/\/github\.com\//.test(url) ? url : undefined);
function toast(message, error) {
  const el = h("div", { class: "toast" + (error ? " err" : ""), role: "status" }, message);
  document.body.append(el);
  setTimeout(() => el.remove(), 6000);
}
function ago(iso) {
  const seconds = (Date.now() - Date.parse(iso)) / 1000;
  if (!Number.isFinite(seconds)) return "";
  if (seconds < 60) return "just now";
  if (seconds < 3600) return Math.round(seconds / 60) + " min ago";
  if (seconds < 86400) return Math.round(seconds / 3600) + " h ago";
  return Math.round(seconds / 86400) + " d ago";
}
async function api(path, options) {
  const response = await fetch(path, { credentials: "same-origin", ...options });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) { const error = new Error(body.error || ("Request failed (" + response.status + ")")); error.status = response.status; throw error; }
  return body;
}
const scoreColor = v => v >= 90 ? "var(--ok)" : v >= 70 ? "var(--warn)" : v >= 50 ? "var(--high)" : "var(--crit)";
const tenColor = v => v >= 8 ? "var(--ok)" : v >= 5 ? "var(--warn)" : v >= 3 ? "var(--high)" : "var(--crit)";
function copyCmd(command) {
  const button = h("button", { class: "btn sm", onclick: async () => {
    try { await navigator.clipboard.writeText(command); button.textContent = "Copied"; setTimeout(() => { button.textContent = "Copy"; }, 1500); }
    catch { toast("Copy failed — select the command instead.", true); }
  } }, "Copy");
  return h("div", { class: "cmd" }, h("code", {}, command), button);
}
function mdText(s) { return String(s || "").replace(/\*\*/g, "").replace(/`/g, ""); }

let session;
let ui;
const cache = new Map();   // fullName -> overview
let current = { name: "", tab: "overview" };

// ---------------------------------------------------------------------------
// Signed out
// ---------------------------------------------------------------------------
function signedOut() {
  root.replaceChildren(h("div", { class: "welcome" }, h("div", { class: "empty" },
    h("h1", {}, "Every agent change, ", h("span", {}, "verified.")),
    h("p", {}, "Sign in with GitHub to see readiness scores, Shield findings, pull request risk, team memory, learned instincts and verified loop receipts for every repository where the FORGE app is installed."),
    h("div", { class: "actions" },
      h("a", { class: "btn primary", href: "/api/github/login" }, "Sign in with GitHub"),
      h("a", { class: "btn", href: "/api/github/install" }, "Install the GitHub App")),
    h("div", { class: "features" },
      h("div", {}, h("b", {}, "Readiness scorecard"), h("span", {}, "Nine deterministic categories, every point backed by evidence.")),
      h("div", {}, h("b", {}, "Shield · 60 rules"), h("span", {}, "Agent permissions, hooks, MCP servers, instructions and CI.")),
      h("div", {}, h("b", {}, "Memory and loops"), h("span", {}, "Handoffs, approved instincts and loop receipts your team committed."))),
    h("p", { class: "muted", style: "margin-top:26px;font-size:12px" }, "FORGE reads repository metadata, manifests, commit subjects and agent configuration files. Source code is not stored.")),
    h("div", { class: "shot" }, h("div", { class: "frame" }, h("div", { class: "bar2" }, h("i"), h("i"), h("i"), h("span", { style: "margin-left:8px" }, "forge-ecc.vercel.app/app")), h("img", { src: "/assets/dashboard-preview.jpg", alt: "FORGE Control Center with readiness scorecard, Shield, setup health, PR risk, handoffs, instincts and loop receipts", loading: "lazy", width: "1440", height: "1250" })),
      h("p", {}, "Control Center preview with sample data. Sign in to see your repositories."))));
}

// ---------------------------------------------------------------------------
// Shell
// ---------------------------------------------------------------------------
function shell(repos) {
  const list = h("div", {});
  const search = h("input", { class: "search", type: "search", placeholder: "Filter repositories", "aria-label": "Filter repositories" });

async function scanAll(button) {

  fleetScanning = true;
  button.disabled = true;
  const queue = session.repositories.slice(0, 25);
  let done = 0;
  const worker = async () => {
    while (queue.length) {
      const repo = queue.shift();
      try { cache.set(repo.fullName, await api("/api/app?op=repo&name=" + encodeURIComponent(repo.fullName))); } catch { /* shown as not scanned */ }

  return [
    h("p", { class: "section-intro" }, installed + " of " + data.harnesses.length + " harnesses installed. Capability labels are FORGE's tested integration level, not everything the tool supports."),
    uncovered.length ? h("div", { class: "banner" }, "This repo uses " + uncovered.map(x => x.name).join(", ") + " but FORGE isn't installed for " + (uncovered.length === 1 ? "it" : "them") + ".", copyCmd("forge install --target " + [...new Set([...(data.setup.state ? data.setup.state.targets : []), ...uncovered.map(x => x.target)])].join(","))) : null,
    h("div", { class: "hgrid" }, data.harnesses.map(x => h("div", { class: "hcard" + (x.installed ? " on" : "") },
      h("div", { class: "t" }, x.name, h("span", { class: "chip " + (x.installed ? "st-active" : x.detected ? "st-candidate" : "st-stalled") }, x.installed ? "installed" : x.detected ? "detected" : "not used")),
      h("div", { class: "caps" }, Object.entries(x.capabilities).map(([k, v]) => [h("span", { class: "muted" }, k), h("span", { class: "st-" + v }, v)]))))),
  ];
}

function profileCard(profile) {
  const total = profile.languages.reduce((sum, l) => sum + l.files, 0) || 1;
  const langs = profile.languages.slice(0, 6);
  return h("div", { class: "card" }, h("h3", {}, "Project profile"),
    langs.length ? h("div", {}, h("div", { class: "langs" }, langs.map((l, i) => h("i", { style: "width:" + (l.files / total * 100) + "%;background:" + COLORS[i % COLORS.length], title: l.language }))),
      h("div", { class: "legend" }, langs.map((l, i) => h("span", { style: "--dot:" + COLORS[i % COLORS.length] }, l.language + " " + Math.round(l.files / total * 100) + "%")))) : null,
    h("div", { style: "margin-top:14px" }, h("b", {}, "Verify commands"),
      profile.verifyCommands.length ? h("pre", {}, profile.verifyCommands.join("\n")) : h("p", { class: "muted" }, "None detected.")),
    profile.conventions.length ? h("div", { style: "margin-top:12px" }, h("b", {}, "Conventions"), h("ul", { class: "plain muted" }, profile.conventions.map(c => h("li", {}, mdText(c))))) : null);
}

function setupCard(setup) {
  const section = (title, items) => items.length ? h("div", { style: "margin-top:10px" }, h("b", {}, title + " (" + items.length + ")"), h("ul", { class: "plain" }, items.slice(0, 8).map(p => h("li", {}, h("code", {}, p))), items.length > 8 ? h("li", { class: "muted" }, "…" + (items.length - 8) + " more") : null)) : null;
  return h("div", { class: "card" }, h("h3", {}, "Setup details"),
    !setup.installed ? h("p", { class: "muted" }, "FORGE files are not on the default branch. “Open setup PR” analyzes this repository and proposes agents, skills, commands, rules and a project guide.")
    : h("div", {}, h("div", { class: "muted", style: "font-size:13px" }, "Installed by FORGE " + setup.state.forgeVersion + " · " + ago(setup.state.installedAt) + " · " + setup.state.targets.join(", ")),
        section("Missing", setup.missing), section("Changed or updatable", setup.outdated), section("New in catalog", setup.added),
        setup.healthy ? h("p", { class: "muted" }, "All FORGE files match the current catalog.") : null));
}

function activityTab(data) {
  return [h("div", { class: "grid2" },
    h("div", { class: "card" }, h("h3", {}, "Activity"),
      data.history.length ? h("ul", { class: "timeline" }, data.history.map(item => h("li", {},
        h("span", { class: "muted" }, ago(item.at)),
        h("span", {}, h("b", {}, item.event === "dashboard" ? "Dashboard" : item.event === "pull_request" ? "PR check" : "/forge " + item.action),
          item.event !== "issue_comment" ? " · " + item.action : "",
          item.detail ? h("span", { class: "muted" }, " — " + item.detail) : null,
          safeUrl(item.url) ? h("span", {}, " · ", h("a", { href: safeUrl(item.url), target: "_blank", rel: "noopener noreferrer" }, "open")) : null))))
      : h("p", { class: "muted" }, "No FORGE activity yet. Comment /forge help on an issue or open a pull request.")),
    h("div", { class: "stack" }, setupCard(data.setup), profileCard(data.profile)))];
}

// ---------------------------------------------------------------------------
// Repository page
// ---------------------------------------------------------------------------
async function runAction(name, action, button) {
  button.disabled = true;
  const label = button.textContent;
  button.textContent = action === "repair" ? "Preparing repair PR…" : "Analyzing & opening PR…";
  try {
    const result = await api("/api/app?op=action", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, action }) });
    if (result.upToDate) toast("FORGE is already up to date on this repository.");
    else { toast("Pull request ready: " + result.created + " new, " + result.updated + " updated files."); if (safeUrl(result.url)) window.open(result.url, "_blank", "noopener"); }
    loadRepo(name, current.tab, "quiet");
  } catch (error) {
    toast(error.message, true);
  } finally {
    button.disabled = false;
    button.textContent = label;
  }
}

function counts(data) {
  return {
    shield: [data.shield.findings.length, data.shield.summary.critical + data.shield.summary.high > 0],
    pulls: [data.pulls.length, data.pulls.some(p => p.risk.level === "critical")],
    memory: [data.memory.entries.length, false],
    instincts: [data.instincts.items.filter(i => i.status === "candidate").length, false],
    loops: [data.loops.length, data.loops.some(l => l.status === "needs-review")],
    harnesses: [data.harnesses.filter(x => x.installed).length, data.harnesses.some(x => x.detected && !x.installed)],
  };
}

function renderRepo(data) {
  const main = ui.main;
  const name = data.repository.fullName;
  const setupLabelText = !data.setup.installed ? "Open setup PR" : "Open repair PR";
  const setupButton = h("button", { class: "btn primary", onclick: () => runAction(name, data.setup.installed ? "repair" : "analyze", setupButton) }, setupLabelText);
  const c = counts(data);
  const tabs = h("nav", { class: "tabs", "aria-label": "Repository sections" }, TABS.map(([id, label]) => h("a", { href: "#/" + name + "/" + id, class: current.tab === id ? "on" : "", "aria-current": current.tab === id ? "page" : null },
    label, c[id] && c[id][0] ? h("span", { class: "count" + (c[id][1] ? " alert" : "") }, c[id][0]) : null)));
  const views = { overview: overviewTab, scorecard: scorecardTab, shield: shieldTab, pulls: d => [h("div", { class: "card" }, h("h3", {}, "Change risk · open pull requests"), pullsList(d.pulls))], memory: memoryTab, instincts: instinctsTab, loops: loopsTab, harnesses: harnessesTab, activity: activityTab };
  main.replaceChildren(
    h("div", { class: "head" },
      h("div", {}, h("h1", {}, name), h("div", { class: "meta" }, "Default branch ", h("code", {}, data.repository.defaultBranch), data.repository.private ? " · private" : " · public", " · scanned " + ago(data.generatedAt))),
      h("div", { class: "actions" }, h("a", { class: "btn", href: "https://github.com/" + name, target: "_blank", rel: "noopener noreferrer" }, "GitHub ↗"), h("button", { class: "btn", onclick: () => loadRepo(name, current.tab, "refresh") }, "Rescan"), setupButton)),
    tabs,
    ...[(views[current.tab] || overviewTab)(data)].flat(Infinity).filter(Boolean));
}

/** mode: undefined = use the cached scan if there is one; "refresh" = rescan with a loading state; "quiet" = rescan in place. */
async function loadRepo(name, tab, mode) {
  current = { name, tab: TABS.some(([id]) => id === tab) ? tab : "overview" };
  setNav("repo");
  ui.render();
  const cached = cache.get(name);
  if (cached && !mode) { renderRepo(cached); return; }
  if (mode !== "quiet") ui.main.replaceChildren(h("div", { class: "head" }, h("div", {}, h("h1", {}, name), h("div", { class: "meta" }, "Scanning repository, agent configuration, memory and open pull requests…"))),
    h("div", { class: "kpis" }, [0, 1, 2, 3].map(() => h("div", { class: "skeleton" }))), h("div", { class: "skeleton", style: "height:260px" }));
  try {
    const data = await api("/api/app?op=repo&name=" + encodeURIComponent(name));
    data.memory = data.memory || { committed: false, entries: [] };
    data.instincts = data.instincts || { committed: false, items: [] };
    data.loops = data.loops || [];
    data.harnesses = data.harnesses || [];
    cache.set(name, data);
    ui.render();
    if (current.name !== name) return;
    renderRepo(data);
  } catch (error) {
    if (current.name !== name) return;
    ui.main.replaceChildren(h("div", { class: "card" }, h("h3", {}, "Could not load " + name), h("p", {}, error.message),
      error.status === 403 || /permission/i.test(error.message) ? h("p", { class: "muted" }, "Ask a repository admin to accept the FORGE app's updated permissions (Contents, Pull requests, Issues and Checks).") : null,
      h("button", { class: "btn", onclick: () => loadRepo(name, current.tab, "refresh") }, "Try again")));
  }
}

function route() {
  const path = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const repos = session.repositories;
  if (!path) {
    if (!repos.length) {
      setNav("fleet");
      ui.main.replaceChildren(h("div", { class: "empty" }, h("h1", {}, "No repositories yet"),
        h("p", {}, session.reauthRequired ? "Sign in again so FORGE can load the repositories you can access." : "Install the FORGE GitHub App on a repository, then sign in again to refresh this list."),
        h("div", { class: "actions" }, h("a", { class: "btn primary", href: "/api/github/install" }, "Install the GitHub App"), h("a", { class: "btn", href: "/api/github/login" }, "Sign in again"))));
      return;
    }
    if (repos.length === 1) { location.replace("#/" + repos[0].fullName + "/overview"); return; }
    return fleet();
  }
  const parts = path.split("/");
  const name = parts.slice(0, 2).join("/");
  const tab = parts[2] || "overview";
  if (repos.some(r => r.fullName === name)) return loadRepo(name, tab);
  location.replace("#/");
}

async function start() {
  try {
    session = await api("/api/app?op=session");
  } catch (error) {
    if (error.status === 401) return signedOut();
    root.replaceChildren(h("div", { class: "empty" }, h("h1", {}, "Dashboard unavailable"), h("p", {}, error.message)));
    return;
  }
  document.getElementById("who").textContent = "@" + session.user.login;
  document.getElementById("topnav").hidden = false;
  const logout = document.getElementById("logout");
  logout.hidden = false;
  logout.addEventListener("click", async () => { await fetch("/api/github/logout", { method: "POST", credentials: "same-origin" }).catch(() => undefined); location.href = "/app/"; });
  ui = shell(session.repositories);
  if (session.reauthRequired) ui.main.before(h("div", { class: "banner", style: "margin:16px 30px 0" }, "Your session was created before the dashboard existed. ", h("a", { href: "/api/github/login" }, "Sign in again"), " to load your repositories."));
  if (new URLSearchParams(location.search).get("github") === "connected") history.replaceState(null, "", "/app/" + location.hash);
  window.addEventListener("hashchange", route);
  route();
}
start();
</script>
</body>
</html>
